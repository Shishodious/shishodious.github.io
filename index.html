<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0c0a" />
    <meta name="robots" content="index, follow" />

    <!-- The build writes one file per route from this template (see
         prerender in vite.config.js and src/seo/snapshot.js), each with its
         own title, description, canonical, Open Graph tags, JSON-LD and page
         text. The values below are the home page's, and what the dev server
         shows. -->
    <title>Priyanshu Shishodia — Video Editor, Designer &amp; Developer</title>
    <meta
      name="description"
      content="Priyanshu Shishodia — video editing, content creation, brand websites and full-stack products, one person start to finish."
    />
    <link rel="canonical" href="https://shishodious.github.io/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Priyanshu Shishodia" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://shishodious.github.io/" />
    <meta property="og:title" content="Priyanshu Shishodia — Video Editor, Designer &amp; Developer" />
    <meta
      property="og:description"
      content="Video, content, brands and products — one person, start to finish."
    />
    <meta property="og:image" content="https://shishodious.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Priyanshu Shishodia — Video, content, brand and product work." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Priyanshu Shishodia — Video Editor, Designer &amp; Developer" />
    <meta
      name="twitter:description"
      content="Video, content, brands and products — one person, start to finish."
    />
    <meta name="twitter:image" content="https://shishodious.github.io/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />


    <!-- Pre-rendered page text is for crawlers: anyone whose browser runs
         the app sees it replaced on load, so it's hidden until then. -->
    <style>
      .js [data-prerender] { display: none; }
    </style>
    <script>
      document.documentElement.classList.add("js");
      // Pick the service's world before first paint so a deep link to a light
      // world doesn't fade in from the default dark one (see src/worlds.css).
      document.documentElement.dataset.world = location.pathname.split("/")[1] || "gate";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Cloudflare Web Analytics (cookieless; also counts client-side route changes). The token is public. -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "c317518f82844ca39b37878859747a40"}'></script>
  </body>
</html>

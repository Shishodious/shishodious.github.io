<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0c0a" />
    <meta name="robots" content="index, follow" />

    <!-- This is a client-rendered SPA with no prerendering: a crawler that
         doesn't run JS (every social-card bot — Facebook, X, LinkedIn, Slack,
         Discord) sees exactly this one title/description/image for every
         route. src/services/meta.js keeps the document itself (title, meta
         description, canonical, OG/Twitter) correct per route for everyone
         who does run JS — visitors and Googlebot's render pass. -->
    <title>Priyanshu Shishodia — Studio</title>
    <meta
      name="description"
      content="Priyanshu Shishodia — video editing, content creation, brand websites and full-stack products, one person start to finish."
    />
    <link rel="canonical" href="https://shishodious.github.io/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Priyanshu Shishodia — Studio" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://shishodious.github.io/" />
    <meta property="og:title" content="Priyanshu Shishodia — Studio" />
    <meta
      property="og:description"
      content="Video, content, brands and products — one person, start to finish."
    />
    <meta property="og:image" content="https://shishodious.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Priyanshu Shishodia — Video, content, brand and product work." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Priyanshu Shishodia — Studio" />
    <meta
      name="twitter:description"
      content="Video, content, brands and products — one person, start to finish."
    />
    <meta name="twitter:image" content="https://shishodious.github.io/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Priyanshu Shishodia",
        "url": "https://shishodious.github.io/",
        "jobTitle": "Video editor & full-stack developer",
        "description": "Video editing, content creation, brand websites and full-stack products.",
        "sameAs": [
          "https://www.linkedin.com/in/priyanshu-shishodia",
          "https://github.com/Shishodious"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Priyanshu Shishodia — Studio",
        "url": "https://shishodious.github.io/"
      }
    </script>

    <script>
      // Pick the service's world before first paint so a deep link to a light
      // world doesn't fade in from the default dark one (see src/worlds.css).
      document.documentElement.dataset.world = location.pathname.split("/")[1] || "gate";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
